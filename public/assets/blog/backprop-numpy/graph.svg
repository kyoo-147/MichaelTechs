<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" role="img" aria-labelledby="figTitle figDesc">
  <title id="figTitle">Forward pass and backward pass through one hidden layer</title>
  <desc id="figDesc">The top row computes z1, relu, a1, logits and the loss left to right. The bottom row carries dlogits, da1, dz1 and the parameter gradients right to left, with dashed connectors linking each backward quantity to the forward value it came from.</desc>

  <defs>
    <marker id="fwd" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#1a1a1a"/>
    </marker>
    <marker id="bwd" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#2f6feb"/>
    </marker>
  </defs>

  <g font-family="ui-sans-serif, -apple-system, 'Segoe UI', Inter, sans-serif" font-size="12">
    <text x="20" y="26" font-size="11" fill="#888" letter-spacing="0.4">FORWARD</text>

    <g fill="#fff" stroke="#1a1a1a" stroke-width="1.4">
      <rect x="20" y="42" width="112" height="46" rx="6"/>
      <rect x="156" y="42" width="96" height="46" rx="6"/>
      <rect x="276" y="42" width="80" height="46" rx="6"/>
      <rect x="380" y="42" width="130" height="46" rx="6"/>
      <rect x="534" y="42" width="80" height="46" rx="6"/>
    </g>
    <g text-anchor="middle" fill="#1a1a1a">
      <text x="76" y="70">z1 = XW1 + b1</text>
      <text x="204" y="70">relu(z1)</text>
      <text x="316" y="70">a1</text>
      <text x="445" y="70">logits = a1W2 + b2</text>
      <text x="574" y="70">loss</text>
    </g>

    <g stroke="#1a1a1a" stroke-width="1.4" fill="none" marker-end="url(#fwd)">
      <path d="M132 65 H 154"/>
      <path d="M252 65 H 274"/>
      <path d="M356 65 H 378"/>
      <path d="M510 65 H 532"/>
    </g>

    <!-- dashed connectors -->
    <g stroke="#c8d6f0" stroke-width="1.2" stroke-dasharray="4 4">
      <path d="M445 88 V 150"/>
      <path d="M316 88 V 150"/>
      <path d="M204 88 V 150"/>
      <path d="M76 88 V 150"/>
    </g>

    <text x="20" y="168" font-size="11" fill="#888" letter-spacing="0.4">BACKWARD</text>

    <g fill="#eef4ff" stroke="#9fbcf0" stroke-width="1.4">
      <rect x="380" y="176" width="130" height="46" rx="6"/>
      <rect x="276" y="176" width="80" height="46" rx="6"/>
      <rect x="156" y="176" width="96" height="46" rx="6"/>
      <rect x="20" y="176" width="112" height="46" rx="6"/>
    </g>
    <g text-anchor="middle" fill="#1f3f7a">
      <text x="445" y="198">dlogits</text>
      <text x="445" y="214" font-size="10.5">(p - onehot) / N</text>
      <text x="316" y="204">da1</text>
      <text x="204" y="198">dz1</text>
      <text x="204" y="214" font-size="10.5">da1 * (z1 &gt; 0)</text>
      <text x="76" y="198">dW1, db1</text>
      <text x="76" y="214" font-size="10.5">X&#7488; dz1, sum</text>
    </g>

    <g stroke="#2f6feb" stroke-width="1.8" fill="none" marker-end="url(#bwd)">
      <path d="M378 199 H 358"/>
      <path d="M274 199 H 254"/>
      <path d="M154 199 H 134"/>
    </g>

    <g fill="#666" font-size="11.5">
      <text x="20" y="272">Each backward value has the same shape as the forward value it belongs to.</text>
      <text x="20" y="294">Parameters are leaves: their gradient sums every path that touched them.</text>
      <text x="20" y="316" fill="#2f6feb">One right-to-left sweep is all reverse mode needs.</text>
    </g>
  </g>
</svg>
