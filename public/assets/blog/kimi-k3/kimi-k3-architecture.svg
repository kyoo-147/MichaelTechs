<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Simplified Kimi K3 architecture</title>
  <desc id="desc">A simplified diagram showing native multimodal input, MoonViT-V2, KDA and Gated MLA layers, sparse expert routing, and generated output.</desc>
  <rect width="1200" height="675" fill="#f3eedf"/>
  <text x="70" y="74" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#23201c">Kimi K3 — simplified architecture</text>
  <text x="70" y="112" font-family="Arial,sans-serif" font-size="18" fill="#6e6a5f">Conceptual diagram based on the official model card; not a layer-by-layer implementation map.</text>
  <g font-family="Arial,sans-serif">
    <rect x="70" y="200" width="190" height="120" rx="12" fill="#fffaf0" stroke="#a79f8f" stroke-width="2"/>
    <text x="165" y="245" text-anchor="middle" font-size="22" font-weight="700" fill="#23201c">Input</text>
    <text x="165" y="279" text-anchor="middle" font-size="17" fill="#6e6a5f">text · image · video</text>
    <path d="M260 260H340" stroke="#c06040" stroke-width="4" marker-end="url(#arrow)"/>
    <rect x="340" y="178" width="220" height="164" rx="12" fill="#e7e0cb" stroke="#a79f8f" stroke-width="2"/>
    <text x="450" y="223" text-anchor="middle" font-size="22" font-weight="700" fill="#23201c">Representation</text>
    <text x="450" y="258" text-anchor="middle" font-size="17" fill="#6e6a5f">MoonViT-V2 vision</text>
    <text x="450" y="286" text-anchor="middle" font-size="17" fill="#6e6a5f">160K vocabulary</text>
    <text x="450" y="314" text-anchor="middle" font-size="17" fill="#6e6a5f">1M-token context</text>
    <path d="M560 260H635" stroke="#c06040" stroke-width="4" marker-end="url(#arrow)"/>
    <rect x="635" y="150" width="270" height="220" rx="12" fill="#d9cfbb" stroke="#a79f8f" stroke-width="2"/>
    <text x="770" y="198" text-anchor="middle" font-size="22" font-weight="700" fill="#23201c">93-layer backbone</text>
    <text x="770" y="236" text-anchor="middle" font-size="17" fill="#6e6a5f">69 KDA layers</text>
    <text x="770" y="267" text-anchor="middle" font-size="17" fill="#6e6a5f">24 Gated MLA layers</text>
    <text x="770" y="298" text-anchor="middle" font-size="17" fill="#6e6a5f">Attention Residuals</text>
    <text x="770" y="329" text-anchor="middle" font-size="17" fill="#6e6a5f">Stable LatentMoE</text>
    <path d="M905 260H980" stroke="#c06040" stroke-width="4" marker-end="url(#arrow)"/>
    <rect x="980" y="200" width="150" height="120" rx="12" fill="#fffaf0" stroke="#a79f8f" stroke-width="2"/>
    <text x="1055" y="245" text-anchor="middle" font-size="22" font-weight="700" fill="#23201c">Output</text>
    <text x="1055" y="278" text-anchor="middle" font-size="17" fill="#6e6a5f">reason · act</text>
    <rect x="360" y="440" width="480" height="132" rx="12" fill="#fffaf0" stroke="#c06040" stroke-width="2"/>
    <text x="600" y="482" text-anchor="middle" font-size="22" font-weight="700" fill="#23201c">Sparse expert routing</text>
    <text x="600" y="519" text-anchor="middle" font-size="19" fill="#6e6a5f">896 experts total · 16 selected per token</text>
    <text x="600" y="551" text-anchor="middle" font-size="19" fill="#6e6a5f">2.8T total parameters · ~104B activated parameters</text>
  </g>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#c06040"/></marker></defs>
</svg>
