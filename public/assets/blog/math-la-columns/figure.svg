<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" role="img" aria-labelledby="figTitle figDesc">
  <title id="figTitle">One matrix, two readings: where the basis vectors land</title>
  <desc id="figDesc">Left: the unit square and the two standard basis vectors. Right: the same square after a matrix is applied; the two arrows are the columns of the matrix.</desc>

  <g font-family="ui-sans-serif, -apple-system, 'Segoe UI', Inter, sans-serif" font-size="13" fill="#1a1a1a" font-weight="600">
    <text x="40" y="36">Before</text>
    <text x="400" y="36">After A</text>
  </g>

  <!-- ============ LEFT PANEL ============ -->
  <g>
    <line x1="90" y1="270" x2="340" y2="270" stroke="#cfcfcf" stroke-width="1"/>
    <line x1="170" y1="90" x2="170" y2="305" stroke="#cfcfcf" stroke-width="1"/>

    <path d="M170 270 L240 270 L240 200 L170 200 Z" fill="#f2f2f2" stroke="#c2c2c2" stroke-width="1" stroke-dasharray="4 3"/>

    <g stroke="#1a1a1a" stroke-width="1.8" fill="none" marker-end="url(#ink)">
      <path d="M170 270 L240 270"/>
      <path d="M170 270 L170 200"/>
    </g>

    <g font-size="13" font-style="italic" fill="#1a1a1a">
      <text x="247" y="289">&#238;</text>
      <text x="152" y="196">&#309;</text>
    </g>
    <text x="96" y="292" font-size="11" fill="#777">unit square</text>
  </g>

  <!-- ============ RIGHT PANEL ============ -->
  <g>
    <line x1="430" y1="270" x2="700" y2="270" stroke="#cfcfcf" stroke-width="1"/>
    <line x1="540" y1="90" x2="540" y2="305" stroke="#cfcfcf" stroke-width="1"/>

    <!-- image of the unit square: origin, col1, col1+col2, col2 -->
    <path d="M540 270 L638 242 L603 165 L505 193 Z" fill="#e8effc" stroke="#a9c2ea" stroke-width="1"/>

    <g stroke="#2f6feb" stroke-width="2.2" fill="none" marker-end="url(#blue)">
      <path d="M540 270 L638 242"/>
    </g>
    <g stroke="#d9480f" stroke-width="2.2" fill="none" marker-end="url(#orange)">
      <path d="M540 270 L505 193"/>
    </g>

    <g font-size="12">
      <text x="646" y="240" fill="#2f6feb">A&#238; (column 1)</text>
      <text x="496" y="182" fill="#d9480f" text-anchor="end">A&#309; (column 2)</text>
    </g>
    <text x="560" y="292" font-size="11" fill="#777">same square, moved</text>
  </g>

  <defs>
    <marker id="ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#1a1a1a"/>
    </marker>
    <marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#2f6feb"/>
    </marker>
    <marker id="orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#d9480f"/>
    </marker>
  </defs>

  <text x="40" y="342" font-size="12" fill="#666">The square is the same object. Only its image changed.</text>
</svg>
